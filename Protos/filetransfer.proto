syntax = "proto3";

service FileUpload {
  rpc Upload (stream FileChunk) returns (UploadStatus);
  rpc Ping (PingRequest) returns (PingReply);
}

message FileChunk {
  string fileName = 1;
  int32 chunkNumber = 2;
  bytes data = 3;
}

message UploadStatus {
  bool success = 1;
  string message = 2;
}

message PingRequest {}

message PingReply {
  string status = 1;
}
